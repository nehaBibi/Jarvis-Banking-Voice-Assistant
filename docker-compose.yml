version: '3.8'

services:
  backend:
    build: .
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - DEBUG=False
      - PORT=5000
      - LOG_LEVEL=INFO
    volumes:
      - ./agents:/app/agents
      - ./utils:/app/utils
    command: gunicorn -w 2 -b 0.0.0.0:5000 app:app

  frontend:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend

networks:
  default:
    name: jarvis-net
